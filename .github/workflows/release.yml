name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release & goreleaser need full history
          # RELEASE_TOKEN must be allowed to bypass branch protection so
          # semantic-release can push the CHANGELOG commit + tag to the branch.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 1. Decide whether a release is due WITHOUT any side effects (no commit,
      #    no tag, no GitHub release). Only its outputs are used to gate the
      #    steps below.
      - name: Check for release (dry run)
        id: dry
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # 2. Validate the full GoReleaser build (binaries + docker images) BEFORE
      #    anything is committed/tagged/published. A snapshot build needs no tag
      #    and pushes nothing, so a broken Dockerfile or build fails here — while
      #    the branch is still untouched.
      - uses: actions/setup-go@v5
        if: steps.dry.outputs.new_release_published == 'true'
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
        if: steps.dry.outputs.new_release_published == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.dry.outputs.new_release_published == 'true'

      - name: Validate GoReleaser build
        if: steps.dry.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      # 3. The build is known-good, so now publish: semantic-release writes the
      #    CHANGELOG, commits it, creates the tag and the GitHub release.
      - name: Semantic Release
        id: semantic
        if: steps.dry.outputs.new_release_published == 'true'
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # 4. Upload the real artifacts to the freshly created release.
      - name: Log in to GHCR
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the released tag
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          git fetch --force --tags
          git checkout ${{ steps.semantic.outputs.new_release_git_tag }}

      - name: Run GoReleaser
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
