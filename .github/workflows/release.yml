name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release & goreleaser need full history
          # RELEASE_TOKEN must be allowed to bypass branch protection so
          # semantic-release can push the CHANGELOG commit + tag to the branch.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # ---- Everything below only runs when a new version was released ----

      - uses: actions/setup-go@v5
        if: steps.semantic.outputs.new_release_published == 'true'
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@v3
        if: steps.semantic.outputs.new_release_published == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.semantic.outputs.new_release_published == 'true'

      - name: Log in to GHCR
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the released tag
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          git fetch --force --tags
          git checkout ${{ steps.semantic.outputs.new_release_git_tag }}

      - name: Run GoReleaser
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
