# Development configuration: authentication disabled, SQLite storage.
server:
  address: ":8080"

auth:
  enabled: false
  default-sub: test-user

bootstrap:
  admin-sub: admin-user-sub
  files:
    - bootstrap/*.yaml

storage:
  shared:
    driver: sqlite
    dsn: data/shared.db
  tenants:
    tenant-a:
      driver: sqlite
      dsn: data/tenant-a.db
    tenant-b:
      driver: sqlite
      dsn: data/tenant-b.db
