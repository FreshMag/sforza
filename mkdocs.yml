site_name: Sforza
site_description: Scoped Functions-Based Access Control (SFBAC) service
# Adjust these once the GitHub repository is public.
site_url: https://freshmag.github.io/sforza/
repo_url: https://github.com/FreshMag/sforza
repo_name: FreshMag/sforza

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Model:
      - SFBAC Concepts: concepts.md
      - Multi-Tenancy: multi-tenancy.md
      - Meta Authorization: meta-authorization.md
  - Guides:
      - Authentication: authentication.md
      - Configuration: configuration.md
      - Bootstrap YAML: bootstrap.md
      - Deployment: deployment.md
  - Reference:
      - REST API: api.md
      - Development: development.md
